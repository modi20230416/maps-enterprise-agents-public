[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agent-planning"
version = "0.1.0"
description = "Priority-aware proactive manufacturing planning and scheduling prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
drl = ["numpy>=1.24"]
gym = ["numpy>=1.24", "gymnasium>=1.0"]

[project.scripts]
enterprise-agent = "enterprise_agent.cli:main"

[tool.setuptools.packages.find]
include = ["enterprise_agent*"]
